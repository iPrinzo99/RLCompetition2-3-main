[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icy_gridworld"
version = "0.2.0"
description = "Icy Grid World Gymnasium environment for CIS 5930"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2.0", "numpy>=1.24,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["icy_gridworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
